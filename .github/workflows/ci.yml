name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests
        run: mvn verify -B -Dspring.profiles.active=test
        env:
          JWT_SECRET: ci-test-secret-must-be-32-chars-min-here
          AWS_REGION: us-east-1
          S3_BUCKET: ci-test-bucket
          MAIL_HOST: ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/regulatory-submission-tracker-*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Build Docker image
        run: docker build -t regulatory-submission-tracker:${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker run -d --name smoke \
            -e JWT_SECRET=smoke-test-secret-32-chars-xxxxxxxxx \
            -e MONGO_URI=mongodb://host.docker.internal:27017/regtracker \
            -p 8080:8080 \
            regulatory-submission-tracker:${{ github.sha }}
          sleep 15
          docker logs smoke
          docker stop smoke || true
