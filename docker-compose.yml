version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: regtracker-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: regtracker
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: regtracker-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localstack
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: regtracker-app
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/regtracker
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: reg-submissions-local
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      JWT_SECRET: change-me-in-production-must-be-32-chars-min
      MAIL_HOST: ""
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  mongo_data:
  localstack_data:
